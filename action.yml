author: JoshuaKGoldberg
branding:
  color: purple
  icon: award
description: Fills in missing allcontributors entries for a repository. 👪
inputs:
  ignored-logins:
    default: ~
    description: >
      RegExp patterns to use for omitting sets of logins (e.g. dependabot).
      The action will not attempt to add these users as contributors.
      Powered by `all-contributors-for-repository`, which comes with its own
      set of reasonable defaults (e.g. `\[bot\]$`).
    required: false
  since:
    default: auto
    description: >
      How far back to look for contributions.
      `auto` looks back to the workflow's previous successful run, which
      requires the `actions: read` permission, and falls back to all history.
      `all` looks at all available history.
      Otherwise, an ISO 8601 date or a duration such as `7d` or `12h`.
    required: false
name: All Contributors Auto Action
runs:
  main: dist/index.js
  using: node24
