body:
  - attributes:
      description: If any of these required steps are not taken, we may not be able to review your issue. Help us to help you!
      label: Bug Report Checklist
      options:
        - label: I have checked the workflow run logs for errors.
          required: true
        - label: I have tried the [latest release](https://github.com/JoshuaKGoldberg/all-contributors-auto-action/releases/latest) of this action and the issue persists.
          required: true
        - label: I have [searched for related issues](https://github.com/JoshuaKGoldberg/all-contributors-auto-action/issues?q=is%3Aissue) and found none that matched my issue.
          required: true
    type: checkboxes
  - attributes:
      description: What did you expect to happen?
      label: Expected
    type: textarea
    validations:
      required: true
  - attributes:
      description: What happened instead?
      label: Actual
    type: textarea
    validations:
      required: true
  - attributes:
      description: Any additional info you'd like to provide.
      label: Additional Info
    type: textarea

description: Report a bug trying to run the code

labels:
  - "type: bug"

name: 🐛 Bug

title: "🐛 Bug: <short description of the bug>"
